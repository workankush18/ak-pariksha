name: AK-CI

on:
  push:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test cases
        id: tests
        run: |
          npm test
          node test_task.js

      - name: Write test result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            echo "Pass" > Result
          else
            echo "Failed" > Result
          fi

      - name: Upload result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-ak-result
          path: Result
          if-no-files-found: error

  ankushbuild:
    name: Build and push EC2 image
    needs: test
    runs-on: ubuntu-latest

    steps:
      # Repository ka code runner par download karta hai taaki Docker image build ho sake.
      - name: Checkout code
        uses: actions/checkout@v4

      # QEMU ARM architecture emulate karta hai, taaki x86 runner par ARM image bhi build ho sake.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Docker Buildx setup karta hai, jo ek hi tag ke liye amd64 aur arm64 images build karega.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Repository secrets mein rakhe username aur token se Docker Hub par login karta hai.
      # Iske liye DOCKERHUB_USERNAME aur DOCKERHUB_TOKEN secrets pehle configure karein.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Dockerfile se x86 aur Graviton EC2 ke liye images build karke Docker Hub ka ec2 tag update karta hai.
      - name: Build and push EC2 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-node-app:ec2
